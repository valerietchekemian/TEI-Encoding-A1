<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio TEI A1 — Accueil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="stile.css"/>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-mark">TEI</span>
          <div class="brand-copy">
            <span class="brand-name">Portfolio A1</span>
            <small>Corpus &amp; analyse</small>
          </div>
        </div>
        <button class="sidebar-close" id="sidebar-close" aria-label="Fermer le menu">✕</button>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-link active" href="accueil.html" data-page="accueil.html">Accueil</a>
        <a class="nav-link" href="tei_corpus.html" data-page="tei_corpus.html">Corpus</a>
        <a class="nav-link" href="analysis/rapport_analyse.html" data-page="analysis/rapport_analyse.html">Analyse</a>
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main-panel">
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Ouvrir le menu">☰</button>
        <div class="topbar-title">
          <span class="topbar-kicker">Portfolio pédagogique</span>
          <h1 id="page-title">Encodage TEI A1</h1>
        </div>
      </header>

      <main class="page-content">
        <iframe id="page-frame" title="Contenu du projet" src="accueil.html"></iframe>
      </main>

      <footer class="page-footer">
        <p><a href="https://github.com/valerietchekemian/TEI-Encoding-A1" target="_blank" rel="noopener noreferrer">Code source GitHub</a></p>
        <p>© 2026 Valérie Tchekemian</p>
        <p>Dernière modification : 13/09/2026</p>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const pageFrame = document.getElementById('page-frame');
    const pageTitle = document.getElementById('page-title');
    const navLinks = document.querySelectorAll('.nav-link');
    const pageTitles = {
      'accueil.html': 'Encodage TEI A1',
      'tei_corpus.html': 'Corpus TEI A1',
      'analysis/rapport_analyse.html': 'Rapport d\'analyse'
    };

    function loadPage(page) {
      pageFrame.src = page;
      pageTitle.textContent = pageTitles[page] || 'Encodage TEI A1';
      document.title = 'Portfolio TEI A1 — ' + (pageTitles[page] || 'Accueil');

      navLinks.forEach((link) => {
        const isActive = link.dataset.page === page;
        link.classList.toggle('active', isActive);
      });
    }

    navLinks.forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        loadPage(link.dataset.page);
      });
    });

    loadPage('accueil.html');
  </script>
</body>
</html>
